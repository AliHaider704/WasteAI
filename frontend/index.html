<!-- File: frontend/index.html -->
<!DOCTYPE html>
<html lang="en" dir="ltr" data-i18n-pending>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#E9E1D3">
  <meta name="description" content="Take a photo of an item and learn which bin it goes in. Arabic and English.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Intelligent Waste Sorting Assistant">
  <meta property="og:description" content="Take a photo of an item and learn which bin it goes in. Arabic and English.">
  <meta property="og:image" content="assets/icon-512.png">
  <meta property="og:locale" content="en">
  <meta property="og:locale:alternate" content="ar">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <title data-i18n="app.title">Intelligent Waste Sorting Assistant</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/results.css">
  <link rel="stylesheet" href="css/consent.css">
  <link rel="stylesheet" href="css/bininfo.css">
  <link rel="stylesheet" href="css/batch.css">
  <link rel="stylesheet" href="css/features/base.css">
  <link rel="preload" as="fetch" crossorigin href="i18n/ar.json">
  <noscript><link rel="stylesheet" href="css/noscript.css"></noscript>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <noscript>
    <p lang="ar" dir="rtl">يحتاج هذا الموقع إلى تفعيل جافاسكربت.</p>
    <p lang="en" dir="ltr">This site needs JavaScript to work.</p>
  </noscript>
  <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>

  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="#/" data-i18n="app.title">Intelligent Waste Sorting Assistant</a>
      <nav class="toolbar" aria-label="Settings" data-i18n-attr="aria-label:nav.settings">
        <button type="button" class="icon-btn" data-action="lang">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#globe"></use></svg>
          <span class="visually-hidden" data-i18n="ctl.lang">Language</span>
        </button>
        <button type="button" class="icon-btn" data-action="theme">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#moon"></use></svg>
          <span class="visually-hidden" data-i18n="ctl.theme">Theme</span>
        </button>
        <button type="button" class="icon-btn" data-action="contrast" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#contrast"></use></svg>
          <span class="visually-hidden" data-i18n="ctl.contrast">High contrast</span>
        </button>
        <button type="button" class="icon-btn" data-action="sound" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#volume-on"></use></svg>
          <span class="visually-hidden" data-i18n="ctl.sound">Sound</span>
        </button>
        <span id="slot-header-tools"></span>
      </nav>
    </div>
  </header>

  <main id="main" class="container app-main">

    <section class="view" data-view="home" aria-labelledby="home-title">
      <h1 id="home-title" tabindex="-1" data-i18n="home.title">What is this item?</h1>
      <p class="lead" data-i18n="home.lead">Take or upload a photo to learn how to dispose of it.</p>
      <div class="actions">
        <button type="button" class="btn btn--primary" data-action="scan">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#camera"></use></svg>
          <span data-i18n="home.scan">Scan</span>
        </button>
        <button type="button" class="btn" data-action="upload">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#upload"></use></svg>
          <span data-i18n="home.upload">Upload photo</span>
        </button>
        <a class="btn" href="#/browse">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
          <span data-i18n="home.browse">Browse categories</span>
        </a>
      </div>
      <p id="stamps-hint" class="stamps__hint muted" data-i18n="home.bins_hint">Tap a bin to see what goes in it and how to prepare it.</p>
      <div class="stamps" role="group" aria-labelledby="stamps-hint"><button type="button" class="bin bin--blue" data-bin-info="blue" aria-haspopup="dialog" data-i18n="bin.blue">Blue bin</button><button type="button" class="bin bin--green" data-bin-info="green" aria-haspopup="dialog" data-i18n="bin.green">Green bin</button><button type="button" class="bin bin--yellow" data-bin-info="yellow" aria-haspopup="dialog" data-i18n="bin.yellow">Yellow bin</button><button type="button" class="bin bin--red" data-bin-info="red" aria-haspopup="dialog" data-i18n="bin.red">Red bin</button><button type="button" class="bin bin--black" data-bin-info="black" aria-haspopup="dialog" data-i18n="bin.black">Black bin</button><button type="button" class="bin bin--brown" data-bin-info="brown" aria-haspopup="dialog" data-i18n="bin.brown">Brown bin</button><button type="button" class="bin bin--grey" data-bin-info="grey" aria-haspopup="dialog" data-i18n="bin.grey">Grey bin</button><button type="button" class="bin bin--special" data-bin-info="special" aria-haspopup="dialog" data-i18n="bin.special">Special collection</button></div>
      <div id="slot-home"></div>
      <div id="slot-capture"></div>
    </section>

    <section class="view" data-view="result" aria-labelledby="result-title" hidden>
      <h1 id="result-title" tabindex="-1" data-i18n="result.title">Result</h1>
      <div id="result-root"></div>
      <div id="slot-result"></div>
      <a class="btn" href="#/" data-i18n="nav.back">Back</a>
    </section>

    <section class="view" data-view="browse" aria-labelledby="browse-title" hidden>
      <h1 id="browse-title" tabindex="-1" data-i18n="browse.title">Categories</h1>
      <div class="field">
        <label class="visually-hidden" for="browse-search" data-i18n="browse.search">Search categories</label>
        <input id="browse-search" class="input" name="q" type="search" inputmode="search" autocomplete="off" placeholder="Search categories" data-i18n-attr="placeholder:browse.search">
      </div>
      <div id="browse-groups" class="chips" role="group" aria-label="Filter by group" data-i18n-attr="aria-label:browse.filter"></div>
      <p id="browse-count" class="muted" aria-live="polite"></p>
      <ul id="browse-list" class="cards"></ul>
      <div id="browse-empty" class="muted" hidden>
        <p data-i18n="browse.empty">No category matches your search.</p>
        <button id="browse-clear" class="btn" type="button" data-i18n="browse.clear">Clear filters</button>
      </div>
      <div id="browse-error" class="muted" hidden role="alert">
        <p data-i18n="browse.error">Could not load categories.</p>
        <button id="browse-retry" class="btn" type="button" data-i18n="browse.retry">Retry</button>
      </div>
      <div id="slot-browse"></div>
    </section>

  </main>
  <div id="slot-footer"></div>
</body>
</html>
