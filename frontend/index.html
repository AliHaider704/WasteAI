<!-- PATH: waste-ai/frontend/index.html -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="app.title">Waste guide</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>

  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="#/" data-i18n="app.title">Waste guide</a>
      <nav class="toolbar" aria-label="Settings" data-i18n-attr="aria-label:nav.settings">
        <button type="button" class="icon-btn" data-action="lang">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#globe"></use></svg>
          <span class="visually-hidden" data-i18n="ctl.lang">Language</span>
        </button>
        <button type="button" class="icon-btn" data-action="theme">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#moon"></use></svg>
          <span class="visually-hidden" data-i18n="ctl.theme">Theme</span>
        </button>
        <button type="button" class="icon-btn" data-action="sound" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#volume-on"></use></svg>
          <span class="visually-hidden" data-i18n="ctl.sound">Sound</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="container app-main">

    <section class="view" data-view="home" aria-labelledby="home-title">
      <h1 id="home-title" tabindex="-1" data-i18n="home.title">What is this item?</h1>
      <p class="lead" data-i18n="home.lead">Take or upload a photo to learn how to dispose of it.</p>
      <div class="actions">
        <button type="button" class="btn btn--primary" data-action="scan">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#camera"></use></svg>
          <span data-i18n="home.scan">Scan</span>
        </button>
        <button type="button" class="btn" data-action="upload">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#upload"></use></svg>
          <span data-i18n="home.upload">Upload photo</span>
        </button>
        <a class="btn" href="#/browse">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
          <span data-i18n="home.browse">Browse categories</span>
        </a>
      </div>
    </section>

    <section class="view" data-view="result" aria-labelledby="result-title" hidden>
      <h1 id="result-title" tabindex="-1" data-i18n="result.title">Result</h1>
      <div id="result-root" aria-live="polite"></div>
      <a class="btn" href="#/" data-i18n="nav.back">Back</a>
    </section>

    <section class="view" data-view="browse" aria-labelledby="browse-title" hidden>
      <h1 id="browse-title" tabindex="-1" data-i18n="browse.title">Categories</h1>
      <div class="field">
        <label class="visually-hidden" for="browse-search" data-i18n="browse.search">Search categories</label>
        <input id="browse-search" class="input" type="search" autocomplete="off">
      </div>
      <div id="browse-groups" class="chips" role="group" aria-label="Filter by group" data-i18n-attr="aria-label:browse.filter"></div>
      <p id="browse-count" class="muted" aria-live="polite"></p>
      <ul id="browse-list" class="cards"></ul>
      <p id="browse-empty" class="muted" hidden data-i18n="browse.empty">No categories match.</p>
      <p id="browse-error" class="muted" hidden data-i18n="browse.error">Could not load categories.</p>
    </section>

  </main>
</body>
</html>
