# File: server/pyproject.toml
[project]
name = "wasteai-server"
version = "1.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1", "ruff==0.8.6", "openapi-spec-validator==0.7.1"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["E501", "E741"]  # one-off evaluation scripts, not served code
